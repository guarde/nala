services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nala
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nala
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U nala]
      interval: 2s
      retries: 20

volumes:
  pgdata: